<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#173b2d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Word Quest" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./assets/icons/icon-180x180.png" />
  <link rel="stylesheet" href="./styles.css" />
  <title>City Word Detective · 영어 단어 수사대</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" data-action="go-home" aria-label="홈으로">
        <span class="brand-badge">CWD</span>
        <span><b>CITY WORD DETECTIVE</b><small>동물도시 영어 수사대</small></span>
      </button>
      <div class="top-actions">
        <span id="profilePill" class="pill profile-pill">🕵️ 수사관</span>
        <span id="streakPill" class="pill">🔥 0일</span>
        <button class="icon-btn" data-action="open-settings" aria-label="설정">⚙️</button>
      </div>
    </header>

    <aside id="dialogueBox" class="dialogue-strip" aria-live="polite">
      <img id="dialogueAvatar" src="./assets/characters/rabbit.png" alt="">
      <div><b id="dialogueSpeaker">단어 수사대</b><span id="dialogueText">오늘의 단어 사건을 해결해 볼까요?</span></div>
    </aside>
    <div id="feverOverlay" class="fever-overlay" aria-hidden="true"></div>

    <main id="view" class="view" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="주요 메뉴">
      <button data-tab="home" class="nav-btn active"><img src="./assets/ui/home.png" alt=""><span>홈</span></button>
      <button data-tab="study" class="nav-btn"><img src="./assets/ui/study.png" alt=""><span>시험지</span></button>
      <button data-tab="quiz" class="nav-btn"><img src="./assets/ui/quiz.png" alt=""><span>수사퀴즈</span></button>
      <button data-tab="review" class="nav-btn"><img src="./assets/ui/review.png" alt=""><span>내 단어장</span></button>
      <button data-tab="mypage" class="nav-btn"><img src="./assets/ui/mypage.png" alt=""><span>기록</span></button>
    </nav>
  </div>

  <div id="toast" class="toast" role="status"></div>
  <div id="modalRoot"></div>
  <input id="cameraInput" type="file" accept="image/*" capture="environment" hidden />
  <script src="./app.js"></script>
</body>
</html>
